/* Offline freestyle Gomoku. Tactical definitions: RIF beginner/advanced tutorials.
   No Renju forbidden-move restrictions are imposed. One ply = one player's move. */
var GomokuAI = (function () {
  'use strict';
  var N=15, DIR=[[1,0],[0,1],[1,1],[1,-1]], WIN=100000000;
  var cache=new Map();
  function inBoard(r,c){return r>=0&&r<N&&c>=0&&c<N;}
  function shape(s){
    if(cache.has(s))return cache.get(s);
    var five=false, fours=new Map(), threes=new Set(), twos=0;
    // Every window contains the newly placed stone at index 5.
    for(var a=1;a<=5;a++){
      var w=s.slice(a,a+5), stones=[], empty=[];
      if(w.indexOf('2')>=0)continue;
      for(var j=a;j<a+5;j++)(s[j]==='1'?stones:empty).push(j);
      if(stones.length===5)five=true;
      if(stones.length===4){var key=stones.join(',');if(!fours.has(key))fours.set(key,new Set());fours.get(key).add(empty[0]);}
    }
    // A genuine three can be extended to .1111. in this same line.
    // This recognizes straight AND split threes, and excludes blocked/edge fakes.
    for(var start=0;start<=5;start++){
      if(s[start]!=='0'||s[start+5]!=='0'||5<=start||5>=start+5)continue;
      var middle=s.slice(start+1,start+5);
      if(middle.indexOf('2')>=0)continue;
      var count=middle.split('1').length-1;
      if(count===3)threes.add(start);
      if(count===2)twos++;
    }
    var ends=new Set();fours.forEach(function(v){v.forEach(function(x){ends.add(x);});});
    var result={five:five, four:fours.size, openFour:ends.size>=2, three:threes.size>0, two:twos>0};
    if(cache.size>60000)cache.clear();cache.set(s,result);return result;
  }
  function analyze(board,r,c,p){
    if(board[r][c])return {score:-1,win:false,fours:0,threes:0,openFour:false};
    var win=false,fours=0,threes=0,openFour=false,twos=0;
    for(var d=0;d<4;d++){
      var s='',dr=DIR[d][0],dc=DIR[d][1];
      for(var k=-5;k<=5;k++){
        var rr=r+dr*k,cc=c+dc*k;
        s+=k===0?'1':!inBoard(rr,cc)?'2':board[rr][cc]===p?'1':board[rr][cc]?'2':'0';
      }
      var t=shape(s);win=win||t.five;fours+=t.four;threes+=t.three?1:0;twos+=t.two?1:0;openFour=openFour||t.openFour;
    }
    var score=win?WIN:openFour||fours>=2?2000000:fours&&threes?600000:threes>=2?180000:fours?45000:threes?12000:twos?400:0;
    score+=fours*100+threes*40+twos*8+14-Math.abs(r-7)-Math.abs(c-7);
    return {score:score,win:win,fours:fours,threes:threes,openFour:openFour};
  }
  function candidates(board){
    var marks=new Set(),occupied=0;
    for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(board[r][c]){
      occupied++;
      for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++){
        var rr=r+dr,cc=c+dc;if(inBoard(rr,cc)&&!board[rr][cc])marks.add(rr*N+cc);

    if(!occupied)return [{r:7,c:7}];
    return Array.from(marks,function(k){return {r:Math.floor(k/N),c:k%N};});
  }
  function ranked(board,p){
    return candidates(board).map(function(m){
      m.attack=analyze(board,m.r,m.c,p);m.defend=analyze(board,m.r,m.c,3-p);
      m.value=Math.max(m.attack.score,m.defend.score*1.05)+Math.min(m.attack.score,m.defend.score)*0.15;
      return m;
    }).sort(function(a,b){return b.value-a.value||a.r-b.r||a.c-b.c;});
  }
  function evaluate(options){
    var own=0,enemy=0;
    options.forEach(function(m){own=Math.max(own,m.attack.score);enemy=Math.max(enemy,m.defend.score);});
    return own-enemy*1.1;
  }
  function choose(input,p,level,config){
    var board=input.map(function(row){return row.slice();}),started=Date.now();config=config||{};
    var settings=level==='expert'?{depth:10,ms:2700,width:16}:level==='hard'?{depth:4,ms:2200,width:12}:level==='medium'?{depth:2,ms:850,width:14}:{depth:1,ms:120,width:8};
    var deadline=started+(config.ms||settings.ms),nodes=0,complete=0,timeout={};
    var table=new Map(),hits=0,killers=[],principal=[],maxPly=0;

    function random32(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return rng|0;}
    if(incremental){
      for(var k=0;k<450;k++){z1[k]=random32();z2[k]=random32();}
      for(var r=0;r<N;r++)for(var c=0;c<N;c++){
        var stone=board[r][c],index=r*N+c;
        if(stone){hash^=z1[index*2+stone-1];hash2^=z2[index*2+stone-1];for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++)if(inBoard(r+dr,c+dc))near[(r+dr)*N+c+dc]++;}

      }
    }
    function make(m,side){
      board[m.r][m.c]=side;if(!incremental)return null;
      var index=m.r*N+m.c,undo=[];hash^=z1[index*2+side-1];hash2^=z2[index*2+side-1];
      for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++)if(inBoard(m.r+dr,m.c+dc))near[(m.r+dr)*N+m.c+dc]++;
      for(var dir of DIR)for(var d=-5;d<=5;d++){
        if(d===0)continue;var r=m.r+dir[0]*d,c=m.c+dir[1]*d;if(!inBoard(r,c)||board[r][c])continue;
        var k=r*N+c;undo.push([k,scores[1][k],scores[2][k]]);scores[1][k]=analyze(board,r,c,1);scores[2][k]=analyze(board,r,c,2);
      }

    }
    function unmake(m,side,undo){
      board[m.r][m.c]=0;if(!incremental)return;
      var index=m.r*N+m.c;hash^=z1[index*2+side-1];hash2^=z2[index*2+side-1];
      for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++)if(inBoard(m.r+dr,m.c+dc))near[(m.r+dr)*N+m.c+dc]--;
      undo.forEach(function(x){scores[1][x[0]]=x[1];scores[2][x[0]]=x[2];});
    }
    function options(side){
      var list=[];
      if(incremental){
        for(var k=0;k<225;k++){var r=Math.floor(k/N),c=k%N;if(board[r][c]||!near[k])continue;
          var attack=scores[side][k],defend=scores[3-side][k];
          list.push({r:r,c:c,attack:attack,defend:defend,value:Math.max(attack.score,defend.score*1.05)+Math.min(attack.score,defend.score)*0.15});
        }
        if(!list.length&&!board.some(function(row){return row.some(Boolean);}))list=[{r:7,c:7,attack:analyze(board,7,7,side),defend:analyze(board,7,7,3-side),value:0}];
        list.sort(function(a,b){return b.value-a.value||a.r-b.r||a.c-b.c;});
      }else list=ranked(board,side);
      return list.filter(function(m){return !config.legal||config.legal(board,m.r,m.c,side);});
    }
    function check(){if(Date.now()>deadline)throw timeout;}
    var roots=options(p);
    function output(m,why){return {r:m.r,c:m.c,depth:complete,nodes:nodes,ms:Date.now()-started,reason:why,cacheHits:hits,targetDepth:settings.depth,maxPly:maxPly,line:principal};}
    if(!roots.length)return null;
    var wins=roots.filter(function(m){return m.attack.win;});
    if(wins.length)return output(wins[0],'win');
    var blocks=roots.filter(function(m){return m.defend.win;});
    if(blocks.length)return output(blocks[0],'block-five');
    if(roots.length===1)return output(roots[0],'opening');
    if(level==='easy'){
      var pool=roots.slice(0,Math.min(6,roots.length));
      return output(pool[Math.floor((config.random||Math.random)()*pool.length)],'casual');
    }
    function negamax(side,depth,alpha,beta,ply,extension){
      nodes++;maxPly=Math.max(maxPly,ply);check();
      var key,entry,originalAlpha=alpha,requestedDepth=depth;
      if(level==='expert'){
        key=hash+':'+hash2+':'+side+':'+ply+':'+extension;
        entry=table.get(key);
        if(entry&&entry.depth>=depth){hits++;if(entry.flag==='exact')return entry.value;if(entry.flag==='lower')alpha=Math.max(alpha,entry.value);else beta=Math.min(beta,entry.value);if(alpha>=beta)return entry.value;}
      }
      var opts=options(side);if(!opts.length)return 0;
      check();
      var win=opts.find(function(m){return m.attack.win;});if(win)return WIN-ply;

      if(forced.length>1)return -WIN+ply+1;
      var tactical=null;
      if(depth<=0){
        if(level==='expert')tactical=opts.filter(function(m){return m.attack.fours||m.attack.threes>=2;});
        if(!extension||(!forced.length&&(!tactical||!tactical.length)))return evaluate(opts);

            if(value>alpha&&value<beta)value=-negamax(3-side,depth-1,-beta,-alpha,ply+1,extension);
          }
          else value=-negamax(3-side,depth-1,-beta,-alpha,ply+1,extension);

        if(value>best){best=value;bestMove=m.r*N+m.c;}alpha=Math.max(alpha,value);if(alpha>=beta){killers[ply]=m.r*N+m.c;break;}

      try{
        for(var i=0;i<rootList.length;i++){
          check();var m=rootList[i],undo=make(m,p);
          var value;try{value=-negamax(3-p,depth-1,-Infinity,-alpha,1,level==='expert'?4:level==='hard'?4:1);}finally{unmake(m,p,undo);}

        }

      if(!finished)break;best=iterationBest;complete=depth;

    return output(best,'search');
  }
  return {analyze:analyze,choose:choose,candidates:candidates,version:'4.2',settings:{easy:1,medium:2,hard:4,expert:10}};
}());

/* Original examples and summaries based on RIF tutorials; freely played Gomoku. */
var GomokuReview = (function(){
  function blank(){return Array.from({length:15},function(){return Array(15).fill(0);});}

/* Gomoku Pro v4: offline training, coach, records and optional Renju-style fouls. */
var GomokuPro=(function(){
  'use strict';
  var N=15,D=[[1,0],[0,1],[1,1],[1,-1]],KEY='gomoku-training-v4';
  function blank(){return Array.from({length:N},function(){return Array(N).fill(0);});}
  function lineCount(b,r,c,p,dr,dc){var n=1;for(var s of[-1,1]){var x=r+dr*s,y=c+dc*s;while(x>=0&&y>=0&&x<N&&y<N&&b[x][y]===p){n++;x+=dr*s;y+=dc*s;}}return n;}
  function forbidden(b,r,c,p,rules){
    if(rules!=='renju'||p!==1||b[r][c])return null;
    b[r][c]=p;var over=D.some(function(d){return lineCount(b,r,c,p,d[0],d[1])>5;});b[r][c]=0;
    if(over)return {type:'长连禁手',text:'黑棋形成六颗或更多连续棋子。'};
    var a=GomokuAI.analyze(b,r,c,p);
    if(a.fours>=2)return {type:'四四禁手',text:'黑棋一手同时形成两路四。'};
    if(a.threes>=2)return {type:'三三禁手',text:'黑棋一手同时形成两路活三。'};
    return null;
  }
  function chooseAI(b,p,level,personality,rules,progress){
    var started=Date.now(),early=b.reduce(function(n,row){return n+row.filter(Boolean).length;},0)<=10;
    var budget=early?180:2700,deadline=started+budget;
    var legal=function(board,r,c,side){return !forbidden(board,r,c,side,rules);};
    var quick=null;
    if(level==='expert'){
      quick=GomokuAI.choose(b,p,'easy',{ms:60,random:function(){return 0;},legal:legal});
      if(progress&&quick)progress(quick);
      if(!quick||quick.reason==='win'||quick.reason==='block-five'||quick.reason==='opening')return quick;
    }
    if(level==='expert'&&!early&&rules!=='renju'&&typeof GomokuReview!=='undefined'){
      var proof=GomokuReview.shortLine(b,p,Math.max(1,Math.min(300,deadline-Date.now())),11);
      if(proof.proven){var first=proof.line[0];return {r:first.r,c:first.c,reason:'proven-forcing-line',line:proof.line,depth:proof.line.length};}
    }
    if(level==='expert'&&Date.now()>=deadline)return quick;
    var budgets={easy:140,medium:900,hard:2400,expert:Math.max(1,deadline-Date.now())},m=GomokuAI.choose(b,p,level,{ms:budgets[level]||900,legal:legal,onProgress:progress});
    if(!m||!forbidden(b,m.r,m.c,p,rules))return m;
    var list=GomokuAI.candidates(b).filter(function(x){return !forbidden(b,x.r,x.c,p,rules);}).map(function(x){var a=GomokuAI.analyze(b,x.r,x.c,p),d=GomokuAI.analyze(b,x.r,x.c,3-p),v=a.score+d.score*(personality==='steady'?1.3:personality==='attack'?0.75:1.05);return {r:x.r,c:x.c,v:v};});
    list.sort(function(a,z){return z.v-a.v;});return list[0]||null;

(function(){
